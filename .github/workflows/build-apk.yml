name: Build MINHAS FINANÇAS APK V10 - VOZ ATUALIZADO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Extrair projeto APK V10 atualizado
        shell: bash
        run: |
          ZIP="./MINHAS_FINANCAS_APK_V10_VOZ.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado na raiz."
            exit 1
          fi

          echo "Usando: $ZIP"

          rm -rf /tmp/mf_apk
          mkdir -p /tmp/mf_apk

          unzip -q "$ZIP" -d /tmp/mf_apk

          if [ ! -d "/tmp/mf_apk/minhas_apk_project" ]; then
            echo "ERRO: pasta minhas_apk_project não encontrada."
            exit 1
          fi

          cp -R /tmp/mf_apk/minhas_apk_project/. .

          if [ ! -f "app/src/main/assets/index.html" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

      - name: Confirmar V10 atualizada
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import base64
          import gzip
          import re

          p = Path("app/src/main/assets/index.html")
          data = p.read_bytes()

          esperado = "d4334f0735e51b01e6e2bb77b463c0dcc4a65983a25b0a53c90b7619d590e46d"
          atual = hashlib.sha256(data).hexdigest()

          print("SHA256 do index.html:", atual)

          if atual != esperado:
              raise SystemExit(
                  "ERRO: o index.html não é a V10 atualizada."
              )

          html = data.decode("utf-8")

          m = re.search(
              r'<script id="mfApkLoader">(.*?)</script>',
              html,
              re.S
          )

          if not m:
              raise SystemExit("ERRO: loader da V10 não encontrado.")

          b = re.search(
              r'atob\("([^"]+)"\)',
              m.group(1)
          )

          if not b:
              raise SystemExit("ERRO: código interno da V10 não encontrado.")

          js = gzip.decompress(
              base64.b64decode(b.group(1))
          ).decode("utf-8")

          obrigatorios = [
              "MF_updateSummaryProgrammed",
              "voiceStatus",
              "MF_sensitiveConfirm",
              "fillPurchase"
          ]

          faltando = [
              item for item in obrigatorios
              if item not in js
          ]

          if faltando:
              raise SystemExit(
                  "ERRO: recursos da V10 ausentes: "
                  + ", ".join(faltando)
              )

          if "pendingManagement" in js:
              raise SystemExit(
                  "ERRO: lógica antiga conflitante do Programado encontrada."
              )

          print("===================================")
          print("V10 ATUALIZADA CONFIRMADA")
          print("Programado: OK")
          print("Comando de voz: OK")
          print("Corrigir compra: OK")
          print("Biometria: OK")
          print("===================================")
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Construir APK
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MINHAS-FINANCAS-V10-VOZ-ATUALIZADO
          path: app/build/outputs/apk/debug/app-debug.apk
